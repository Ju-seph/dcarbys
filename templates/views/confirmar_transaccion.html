{% extends "base.html" %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Confirmando tu pago</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <p>Estamos confirmando tu pago con PayPhone. Por favor, espera un momento...</p>
                    </div>
                    <div id="loading" class="text-center my-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-2">Procesando tu pago...</p>
                    </div>
                    <div id="resultado" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    // Función para obtener parámetros de la URL
    function getQueryVariable(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split("=");
            if (pair[0] == variable) {
                return pair[1];
            }
        }
        return false;
    }

    $(document).ready(function () {
        // Obtener los parámetros de la URL
        var id = getQueryVariable('id');
        var clientTransactionId = getQueryVariable('clientTransactionId');

        console.log("ID de transacción:", id);
        console.log("ID de transacción del cliente:", clientTransactionId);

        if (!id || !clientTransactionId) {
            $("#resultado").html('<div class="alert alert-danger">Error: Parámetros de transacción no encontrados</div>');
            return;
        }

        // Guardar el carrito en localStorage para referencia
        var cart = JSON.parse(localStorage.getItem('cart') || '[]');

        // Realizar la solicitud a la API de PayPhone para confirmar la transacción
        $.ajax({
            url: "https://pay.payphonetodoesposible.com/api/button/V2/Confirm",
            type: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer {{payphone.token}}"
            },
            data: JSON.stringify({
                "id": parseInt(id),
                "clientTxId": clientTransactionId
            }),
            success: function (response) {
                console.log("Respuesta de PayPhone:", response);
                $("#resultado").html(
                    '<div class="alert alert-success">Pago confirmado con PayPhone. Procesando pedido...</div>'
                );

                // Enviar los datos al servidor para procesar el pedido
                enviarFormularioManual();
            },
            error: function (error) {
                console.error("Error en la solicitud a PayPhone:", error);
                $("#resultado").html(
                    '<div class="alert alert-warning">No se pudo confirmar con la API de PayPhone. Intentando método alternativo...</div>'
                );

                // Si falla la confirmación con la API, intentar el método manual
                enviarFormularioManual();
            }
        });

        // Función para enviar el formulario manual como respaldo
        function enviarFormularioManual() {
            // Crear un formulario para enviar los datos
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = '/procesar_pago_payphone_manual';

            // Añadir los campos necesarios
            var addField = function (name, value) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = value;
                form.appendChild(input);
            };

            addField('payment_id', id);
            addField('client_transaction_id', clientTransactionId);
            addField('cart', JSON.stringify(cart));

            // Añadir el formulario al documento y enviarlo
            document.body.appendChild(form);

            $("#resultado").html('<div class="alert alert-info">Procesando pago manualmente...</div>');

            // Enviar el formulario después de un breve retraso
            setTimeout(function () {
                form.submit();
            }, 1000);
        }
    });
</script>
{% endblock %}
