{% extends "base.html" %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Confirmando tu pago</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <p>Estamos confirmando tu pago con PayPhone. Por favor, espera un momento...</p>
                    </div>
                    <div id="loading" class="text-center my-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-2">Procesando tu pago...</p>
                    </div>
                    <div id="resultado" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Función para obtener parámetros de la URL
    function getQueryVariable(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split("=");
            if (pair[0] == variable) {
                return pair[1];
            }
        }
        return false;
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Obtener los parámetros de la URL
        var id = getQueryVariable('id');
        var clientTransactionId = getQueryVariable('clientTransactionId');

        console.log("ID de transacción:", id);
        console.log("ID de transacción del cliente:", clientTransactionId);

        if (!id || !clientTransactionId) {
            document.getElementById("resultado").innerHTML = '<div class="alert alert-danger">Error: Parámetros de transacción no encontrados</div>';
            return;
        }

        // Guardar el carrito en localStorage para referencia
        var cart = JSON.parse(localStorage.getItem('cart') || '[]');

        // Obtener los datos del formulario de checkout si existen
        var nombre = localStorage.getItem('checkout_nombre') || '';
        var celular = localStorage.getItem('checkout_celular') || '';
        var ciudad = localStorage.getItem('checkout_ciudad') || 'Machala';
        var direccion = localStorage.getItem('checkout_direccion') || '';
        var referencia = localStorage.getItem('checkout_referencia') || '';

        // Crear un formulario para enviar los datos
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '/procesar_pago_payphone_manual';

        // Añadir los campos necesarios
        var addField = function (name, value) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            input.value = value;
            form.appendChild(input);
        };

        addField('payment_id', id);
        addField('client_transaction_id', clientTransactionId);
        addField('cart', JSON.stringify(cart));

        // Añadir los datos de envío
        addField('nombre', nombre);
        addField('celular', celular);
        addField('ciudad', ciudad);
        addField('direccion', direccion);
        addField('referencia', referencia);

        // Añadir el formulario al documento y enviarlo
        document.body.appendChild(form);

        // Enviar el formulario después de un breve retraso para mostrar el spinner
        setTimeout(function () {
            console.log("Enviando formulario con datos de pago...");
            form.submit();
        }, 2000);
    });
</script>
{% endblock %}
