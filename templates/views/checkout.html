{% extends "base.html" %}

{% block body %}
<div class="container mt-5">
    <h2>Finalizar Compra</h2>
    <div class="row">
        <div class="col-md-8">
            <h3>Resumen del Pedido</h3>
            <p>Número de Pedido: <strong id="purchase-number"></strong></p>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Unitario</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="cart-summary">
                    <!-- El resumen del carrito se llenará con JavaScript -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="text-end"><strong>Total:</strong></td>
                        <td><strong id="cart-total"></strong></td>
                    </tr>
                </tfoot>
            </table>
            
            <form id="checkout-form">
                <h3>Información de Envío</h3>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" required>
                </div>
                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion" required>
                </div>
                <div class="mb-3">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" name="ciudad" required>
                </div>
                <div class="mb-3">
                    <label for="codigo_postal" class="form-label">Código Postal</label>
                    <input type="text" class="form-control" id="codigo_postal" name="codigo_postal" required>
                </div>
                <button type="submit" class="btn btn-primary">Procesar Pedido</button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const cartSummary = document.getElementById('cart-summary');
    const cartTotal = document.getElementById('cart-total');
    let total = 0;

    // Generate a random purchase number
    const purchaseNumber = Math.floor(100000 + Math.random() * 900000);
    document.getElementById('purchase-number').textContent = purchaseNumber;

    cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.quantity}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>$${subtotal.toFixed(2)}</td>
        `;
        cartSummary.appendChild(tr);
    });

    cartTotal.textContent = `$${total.toFixed(2)}`;

    document.getElementById('checkout-form').addEventListener('submit', function(e) {
        e.preventDefault();
        procesarPedido();
    });

    function procesarPedido() {
        fetch('/procesar_pedido', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                purchaseNumber: purchaseNumber,
                cart: cart,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                ciudad: document.getElementById('ciudad').value,
                codigo_postal: document.getElementById('codigo_postal').value,
                total: total
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                mostrarConfirmacion(data.order_id);
            } else {
                alert('Error al procesar el pedido: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Hubo un error al procesar el pedido');
        });
    }

    function mostrarConfirmacion(orderId) {
        const confirmationHtml = `
            <h3>Pedido Procesado</h3>
            <p>Tu pedido ha sido procesado con éxito. ¿Deseas confirmar el pedido?</p>
            <button id="confirm-order" class="btn btn-success">Confirmar Pedido</button>
            <button id="cancel-order" class="btn btn-danger">Cancelar Pedido</button>
        `;
        document.querySelector('.col-md-8').innerHTML = confirmationHtml;

        document.getElementById('confirm-order').addEventListener('click', function() {
            confirmarPedido(orderId);
        });

        document.getElementById('cancel-order').addEventListener('click', function() {
            cancelarPedido(orderId);
        });
    }

    function confirmarPedido(orderId) {
        fetch(`/confirmar_pedido/${orderId}`, {
            method: 'POST',
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Pedido confirmado con éxito');
                localStorage.removeItem('cart');  // Limpiar el carrito
                window.location.href = '/';  // Redirigir a la página principal
            } else {
                alert('Error al confirmar el pedido: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Hubo un error al confirmar el pedido');
        });
    }

    function cancelarPedido(orderId) {
        // Aquí puedes implementar la lógica para cancelar el pedido si es necesario
        alert('Pedido cancelado');
        window.location.href = '/';  // Redirigir a la página principal
    }
});
</script>
{% endblock %}
