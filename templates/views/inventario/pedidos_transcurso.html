<div class="table-responsive">
    <table id="tablaPedidosTranscurso" width="100%" cellspacing="0" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Número de Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Fecha de Confirmación</th>
                <th>Tiempo Estimado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los pedidos en transcurso se cargarán dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>

<!-- Incluir PDFMake desde un CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
    /* Estilos para la tabla */
    #tablaPedidosTranscurso {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.9em;
        font-family: sans-serif;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        background-color: #f8f9fa;
        /* Color de fondo de la tabla */
        color: #333333;
        /* Color del texto en la tabla */
    }

    /* Encabezado de la tabla */
    #tablaPedidosTranscurso thead tr {
        background-color: #dc3545;
        /* Color rojo */
        color: #ffffff;
        /* Color del texto en el encabezado */
    }

    /* Celdas de la tabla */
    #tablaPedidosTranscurso th,
    #tablaPedidosTranscurso td {
        padding: 12px 15px;
        border: 1px solid #dddddd;
        /* Borde de las celdas */
    }

    /* Filas pares */
    #tablaPedidosTranscurso tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
        /* Fondo gris claro para filas pares */
    }

    /* Filas impares */
    #tablaPedidosTranscurso tbody tr:nth-of-type(odd) {
        background-color: #ffffff;
        /* Fondo blanco para filas impares */
    }

    /* Última fila */
    #tablaPedidosTranscurso tbody tr:last-of-type {
        border-bottom: 2px solid #dc3545;
        /* Borde inferior rojo */
    }

    /* Efecto hover */
    #tablaPedidosTranscurso tbody tr:hover {
        background-color: #f8d7da;
        /* Color rojo claro al pasar el mouse */
    }

    /* Botones en la columna de acciones */
    .btn-sm {
        margin: 2px;
    }

    .btn-success {
        background-color: #28a745;
        border-color: #28a745;
    }

    .btn-info {
        background-color: #17a2b8;
        border-color: #17a2b8;
    }
</style>

<script>
    $(document).ready(function () {
        $('#tablaPedidosTranscurso').DataTable({
            ajax: {
                url: '/obtener_pedidos_transcurso',
                dataSrc: 'data'
            },
            columns: [
                { data: 'numero_pedido' },
                { data: 'nombre' },
                {
                    data: 'productos',
                    render: function (data) {
                        return data.map(p => `${p.name} (x${p.quantity})`).join('<br>');
                    }
                },
                { data: 'total', render: function (data) { return `$${data.toFixed(2)}`; } },
                {
                    data: 'fecha_confirmacion',
                    render: function (data) {
                        if (data) {
                            const fecha = new Date(data);
                            return fecha.toLocaleString('es-EC', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            });
                        }
                        return 'No disponible';
                    }
                },
                {
                    data: 'tiempo_estimado',
                    render: function (data) {
                        if (data) {
                            // Convertir minutos a formato más legible
                            if (data >= 60) {
                                const horas = Math.floor(data / 60);
                                const minutos = data % 60;
                                if (minutos === 0) {
                                    return `${horas} hora${horas > 1 ? 's' : ''}`;
                                } else {
                                    return `${horas} hora${horas > 1 ? 's' : ''} y ${minutos} minuto${minutos > 1 ? 's' : ''}`;
                                }
                            } else {
                                return `${data} minuto${data > 1 ? 's' : ''}`;
                            }
                        }
                        return 'Pedido en Linea';
                    }
                },
                {
                    data: '_id',
                    render: function (data, type, row) {
                        return `
                            <button class="btn btn-sm btn-success" onclick="finalizarPedido('${data}')">
                                <i class="bi bi-check-circle"></i> Finalizar
                            </button>
                            <button class="btn btn-sm btn-info" onclick="mostrarTicket('${data}')">
                                <i class="bi bi-receipt"></i> Ticket
                            </button>
                        `;
                    }
                }
            ],
            order: [[4, 'desc']],  // Ordenar por la columna 4 (fecha_confirmacion) de forma descendente
            language: {
                search: "Buscar:",
                lengthMenu: "Mostrar _MENU_ registros por página",
                zeroRecords: "No se encontraron resultados",
                info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
                infoEmpty: "Mostrando 0 a 0 de 0 registros",
                infoFiltered: "(filtrado de _MAX_ registros totales)",
                paginate: {
                    first: "Primero",
                    last: "Último",
                    next: "Siguiente",
                    previous: "Anterior"
                }
            },
            dom: '<"top"lf>rt<"bottom"ip><"clear">',  // Personalizar la disposición de los controles
            responsive: true  // Hacer la tabla responsive
        });

        // Actualizar la tabla cada 30 segundos
        setInterval(function () {
            $('#tablaPedidosTranscurso').DataTable().ajax.reload(null, false);
        }, 30000);
    });

    // Función para finalizar un pedido
    function finalizarPedido(pedidoId) {
        Swal.fire({
            title: '¿Finalizar pedido?',
            text: "¿Confirmas que este pedido ha sido entregado al cliente?",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sí, finalizar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Procesando...',
                    text: 'Finalizando el pedido',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                fetch(`/finalizar_pedido/${pedidoId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Error en la solicitud');
                        }
                        return response.json();
                    })
                    .then(data => {
                        Swal.close();

                        if (data.success) {
                            Swal.fire({
                                icon: 'success',
                                title: '¡Pedido Finalizado!',
                                text: 'El pedido ha sido marcado como entregado exitosamente.',
                                confirmButtonColor: '#28a745',
                                timer: 3000,
                                timerProgressBar: true
                            });
                            $('#tablaPedidosTranscurso').DataTable().ajax.reload(null, false); // Recargar la tabla
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: data.message || 'Error al finalizar el pedido',
                                confirmButtonColor: '#dc3545'
                            });
                        }
                    })
                    .catch(error => {
                        Swal.close();
                        console.error('Error:', error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de Conexión',
                            text: 'Hubo un error al comunicarse con el servidor. Por favor, intente nuevamente.',
                            confirmButtonColor: '#dc3545'
                        });
                    });
            }
        });
    }

    // Función para mostrar el ticket en PDF
    function mostrarTicket(pedidoId) {
        fetch(`/obtener_detalles_pedido/${pedidoId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const pedido = data.pedido;

                    // Definir el contenido del PDF
                    const docDefinition = {
                        content: [
                            { text: 'Ticket del Pedido', style: 'header' },
                            `Número de Pedido: ${pedido.numero_pedido}`,
                            `Cliente: ${pedido.nombre}`,
                            `Celular: ${pedido.celular}`,
                            `Ciudad: ${pedido.ciudad}`,
                            `Dirección: ${pedido.direccion}`,
                            `Referencia: ${pedido.referencia || 'No especificada'}`,
                            `Método de Pago: ${pedido.metodo_pago}`,  // Mostrar el método de pago
                            `Total: $${pedido.total.toFixed(2)}`,
                            { text: 'Productos:', style: 'subheader' },
                            {
                                table: {
                                    headerRows: 1,
                                    widths: ['*', 'auto', 'auto', 'auto'],
                                    body: [
                                        ['Producto', 'Cantidad', 'Precio Unit.', 'Subtotal'],
                                        ...pedido.productos.map(p => [
                                            p.name,
                                            p.quantity,
                                            `$${p.price.toFixed(2)}`,
                                            `$${(p.price * p.quantity).toFixed(2)}`
                                        ])
                                    ]
                                }
                            },
                            { text: `Fecha y hora: ${new Date().toLocaleString('es-EC')}`, margin: [0, 20, 0, 0] },
                            { text: 'Gracias por su compra', style: 'thanks', alignment: 'center', margin: [0, 20, 0, 0] }
                        ],
                        styles: {
                            header: {
                                fontSize: 18,
                                bold: true,
                                margin: [0, 0, 0, 10]
                            },
                            subheader: {
                                fontSize: 14,
                                bold: true,
                                margin: [0, 10, 0, 5]
                            },
                            thanks: {
                                fontSize: 12,
                                italics: true
                            }
                        },
                        footer: function (currentPage, pageCount) {
                            return {
                                text: `Página ${currentPage} de ${pageCount}`,
                                alignment: 'center',
                                fontSize: 8
                            };
                        }
                    };

                    // Generar y abrir el PDF
                    pdfMake.createPdf(docDefinition).open();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message || 'Error al obtener los detalles del pedido',
                        confirmButtonColor: '#dc3545'
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Conexión',
                    text: 'Hubo un error al obtener los detalles del pedido. Por favor, intente nuevamente.',
                    confirmButtonColor: '#dc3545'
                });
            });
    }
</script>
