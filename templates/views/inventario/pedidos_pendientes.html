<div class="table-responsive">
    <table id="tablaPedidosPendientes" width="100%" cellspacing="0" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Número de Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Fecha de Creación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los pedidos pendientes se cargarán dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
    /* Estilos para la tabla */
    #tablaPedidosPendientes {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.9em;
        font-family: sans-serif;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        background-color: #f8f9fa;
        /* Color de fondo de la tabla */
        color: #333333;
        /* Color del texto en la tabla */
    }

    /* Encabezado de la tabla */
    #tablaPedidosPendientes thead tr {
        background-color: #dc3545;
        /* Color rojo */
        color: #ffffff;
        /* Color del texto en el encabezado */
    }

    /* Celdas de la tabla */
    #tablaPedidosPendientes th,
    #tablaPedidosPendientes td {
        padding: 12px 15px;
        border: 1px solid #dddddd;
        /* Borde de las celdas */
    }

    /* Filas pares */
    #tablaPedidosPendientes tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
        /* Fondo gris claro para filas pares */
    }

    /* Filas impares */
    #tablaPedidosPendientes tbody tr:nth-of-type(odd) {
        background-color: #ffffff;
        /* Fondo blanco para filas impares */
    }

    /* Última fila */
    #tablaPedidosPendientes tbody tr:last-of-type {
        border-bottom: 2px solid #dc3545;
        /* Borde inferior rojo */
    }

    /* Efecto hover */
    #tablaPedidosPendientes tbody tr:hover {
        background-color: #f8d7da;
        /* Color rojo claro al pasar el mouse */
    }

    /* Botones en la columna de acciones */
    .btn-sm {
        margin: 2px;
    }

    .btn-success {
        background-color: #28a745;
        border-color: #28a745;
    }

    .btn-danger {
        background-color: #dc3545;
        border-color: #dc3545;
    }
</style>

<script>
    // Modifica la función aceptarPedido para evitar el error después del éxito
    function aceptarPedido(pedidoId) {
        // Usar SweetAlert2 para el input
        Swal.fire({
            title: 'Tiempo estimado de entrega',
            input: 'number',
            inputLabel: 'Ingrese el tiempo estimado en minutos',
            inputPlaceholder: 'Ej: 30',
            inputAttributes: {
                min: 1,
                max: 180,
                step: 1
            },
            inputValue: 30,
            showCancelButton: true,
            confirmButtonText: 'Aceptar Pedido',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            inputValidator: (value) => {
                if (!value || value < 1) {
                    return 'Por favor ingrese un tiempo válido (mínimo 1 minuto)';
                }
                if (value > 180) {
                    return 'El tiempo máximo permitido es de 180 minutos (3 horas)';
                }
            }
        }).then((result) => {
            if (result.isConfirmed) {
                const tiempo = parseInt(result.value);

                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Procesando...',
                    text: 'Aceptando el pedido',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                fetch(`/aceptar_pedido/${pedidoId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ tiempo_estimado: tiempo })
                })
                    .then(response => {
                        console.log("Respuesta del servidor:", response.status);
                        return response.json().catch(error => {
                            // Si hay un error al parsear el JSON, devolver un objeto con error
                            console.error("Error al parsear JSON:", error);
                            throw new Error("Error en la respuesta del servidor");
                        });
                    })
                    .then(data => {
                        // Cerrar el indicador de carga
                        Swal.close();

                        if (data.success) {
                            Swal.fire({
                                icon: 'success',
                                title: '¡Pedido Aceptado!',
                                text: 'El pedido ha sido aceptado y está en proceso de preparación.',
                                confirmButtonColor: '#28a745',
                                timer: 3000,
                                timerProgressBar: true
                            });

                            // Recargar la tabla después de un breve retraso
                            setTimeout(() => {
                                try {
                                    $('#tablaPedidosPendientes').DataTable().ajax.reload(null, false);
                                } catch (error) {
                                    console.error("Error al recargar la tabla:", error);
                                    location.reload(); // Si falla la recarga de la tabla, recargar la página
                                }
                            }, 500);
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: data.message || 'Error al aceptar el pedido',
                                confirmButtonColor: '#dc3545'
                            });
                        }
                    })
                    .catch(error => {
                        // Cerrar el indicador de carga
                        Swal.close();

                        console.error('Error:', error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de Conexión',
                            text: 'Hubo un error al comunicarse con el servidor. Por favor, intente nuevamente.',
                            confirmButtonColor: '#dc3545'
                        });
                    });
            }
        });
    }

    // Modifica la función cancelarPedidoAdmin para evitar el error después del éxito
    function cancelarPedidoAdmin(pedidoId) {
        Swal.fire({
            title: '¿Estás seguro?',
            text: "¿Deseas cancelar este pedido? Esta acción no se puede deshacer.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sí, cancelar pedido',
            cancelButtonText: 'No, mantener pedido',
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                // Mostrar indicador de carga
                Swal.fire({
                    title: 'Procesando...',
                    text: 'Cancelando el pedido',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                fetch(`/cancelar_pedido_admin/${pedidoId}`, {
                    method: 'POST'
                })
                    .then(response => {
                        console.log("Respuesta del servidor:", response.status);
                        return response.json().catch(error => {
                            console.error("Error al parsear JSON:", error);
                            throw new Error("Error en la respuesta del servidor");
                        });
                    })
                    .then(data => {
                        // Cerrar el indicador de carga
                        Swal.close();

                        if (data.success) {
                            Swal.fire({
                                icon: 'success',
                                title: '¡Pedido Cancelado!',
                                text: data.message || 'El pedido ha sido cancelado exitosamente.',
                                confirmButtonColor: '#28a745',
                                timer: 3000,
                                timerProgressBar: true
                            });

                            // Recargar la tabla después de un breve retraso
                            setTimeout(() => {
                                try {
                                    $('#tablaPedidosPendientes').DataTable().ajax.reload(null, false);
                                } catch (error) {
                                    console.error("Error al recargar la tabla:", error);
                                    location.reload(); // Si falla la recarga de la tabla, recargar la página
                                }
                            }, 500);
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: data.message || 'Error al cancelar el pedido',
                                confirmButtonColor: '#dc3545'
                            });
                        }
                    })
                    .catch(error => {
                        // Cerrar el indicador de carga
                        Swal.close();

                        console.error('Error:', error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de Conexión',
                            text: 'Hubo un error al comunicarse con el servidor. Por favor, intente nuevamente.',
                            confirmButtonColor: '#dc3545'
                        });
                    });
            }
        });
    }

    let lastCount = 0;

    function actualizarPedidosPendientes() {
        fetch('/obtener_numero_pedidos_pendientes')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const badge = document.getElementById('pedidos-pendientes-badge');
                    const tabTitle = document.getElementById('v-pills-pedidos-tab');
                    if (data.count > 0) {
                        badge.textContent = data.count;
                        badge.style.display = 'inline-block';
                        tabTitle.textContent = `Pedidos (${data.count})`;
                        document.title = `(${data.count}) Pedidos - Panel de Administración`;

                        // Reproducir sonido si hay un nuevo pedido
                        if (data.count > lastCount) {
                            const audio = new Audio('/public/sounds/notification.mp3');
                            audio.play();

                            // Mostrar notificación de nuevo pedido
                            if (Notification.permission === "granted") {
                                const notification = new Notification("Nuevo Pedido", {
                                    body: "Has recibido un nuevo pedido pendiente",
                                    icon: "/public/img/logo.png"
                                });
                            }
                        }
                    } else {
                        badge.style.display = 'none';
                        tabTitle.textContent = 'Pedidos';
                        document.title = 'Pedidos - Panel de Administración';
                    }
                    lastCount = data.count;
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    // Corrige la función cargarPedidosPendientes para que esté disponible globalmente
    window.cargarPedidosPendientes = function () {
        $('#tablaPedidosPendientes').DataTable().ajax.reload(null, false);
    };

    $(document).ready(function () {
        // Solicitar permiso para notificaciones
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        // Inicializar la tabla
        var tabla = $('#tablaPedidosPendientes').DataTable({
            ajax: {
                url: '/obtener_pedidos_pendientes',
                dataSrc: 'data'
            },
            columns: [
                { data: 'numero_pedido' },
                { data: 'nombre' },
                {
                    data: 'productos',
                    render: function (data) {
                        return data.map(p => `${p.name} (x${p.quantity})`).join('<br>');
                    }
                },
                { data: 'total', render: function (data) { return `$${data.toFixed(2)}`; } },
                {
                    data: 'createDateTime',
                    render: function (data) {
                        if (data) {
                            const fecha = new Date(data);
                            return fecha.toLocaleString('es-EC', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            });
                        }
                        return 'No disponible';
                    }
                },
                {
                    data: '_id',
                    render: function (data) {
                        return `
                            <button class="btn btn-sm btn-success me-2" onclick="aceptarPedido('${data}')">
                                <i class="bi bi-check-lg"></i> Aceptar
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="cancelarPedidoAdmin('${data}')">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </button>
                        `;
                    }
                }
            ],
            language: {
                search: "Buscar:",
                lengthMenu: "Mostrar _MENU_ registros por página",
                zeroRecords: "No se encontraron resultados",
                info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
                infoEmpty: "Mostrando 0 a 0 de 0 registros",
                infoFiltered: "(filtrado de _MAX_ registros totales)",
                paginate: {
                    first: "Primero",
                    last: "Último",
                    next: "Siguiente",
                    previous: "Anterior"
                }
            },
            dom: '<"top"lf>rt<"bottom"ip><"clear">',  // Personalizar la disposición de los controles
            responsive: true  // Hacer la tabla responsive
        });

        // Actualizar la tabla cada 5 segundos
        setInterval(function () {
            try {
                tabla.ajax.reload(null, false);
            } catch (error) {
                console.error("Error al recargar la tabla:", error);
            }
        }, 5000);

        // Actualizar el contador de pedidos pendientes cada 10 segundos
        setInterval(actualizarPedidosPendientes, 10000);

        // Ejecutar una vez al cargar la página
        actualizarPedidosPendientes();
    });
</script>
