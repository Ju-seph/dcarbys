<div class="table-responsive">
    <table id="tablaPedidosPendientes" width="100%" cellspacing="0" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Número de Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los pedidos pendientes se cargarán dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
    /* Estilos para la tabla */
    #tablaPedidosPendientes {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.9em;
        font-family: sans-serif;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        background-color: #f8f9fa;
        /* Color de fondo de la tabla */
        color: #333333;
        /* Color del texto en la tabla */
    }

    /* Encabezado de la tabla */
    #tablaPedidosPendientes thead tr {
        background-color: #dc3545;
        /* Color rojo */
        color: #ffffff;
        /* Color del texto en el encabezado */
    }

    /* Celdas de la tabla */
    #tablaPedidosPendientes th,
    #tablaPedidosPendientes td {
        padding: 12px 15px;
        border: 1px solid #dddddd;
        /* Borde de las celdas */
    }

    /* Filas pares */
    #tablaPedidosPendientes tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
        /* Fondo gris claro para filas pares */
    }

    /* Filas impares */
    #tablaPedidosPendientes tbody tr:nth-of-type(odd) {
        background-color: #ffffff;
        /* Fondo blanco para filas impares */
    }

    /* Última fila */
    #tablaPedidosPendientes tbody tr:last-of-type {
        border-bottom: 2px solid #dc3545;
        /* Borde inferior rojo */
    }

    /* Efecto hover */
    #tablaPedidosPendientes tbody tr:hover {
        background-color: #f8d7da;
        /* Color rojo claro al pasar el mouse */
    }

    /* Botones en la columna de acciones */
    .btn-sm {
        margin: 2px;
    }

    .btn-success {
        background-color: #28a745;
        border-color: #28a745;
    }

    .btn-danger {
        background-color: #dc3545;
        border-color: #dc3545;
    }
</style>

<script>
    // Modifica la función aceptarPedido para evitar el error después del éxito
    function aceptarPedido(pedidoId) {
        const tiempoEstimado = prompt("Ingrese el tiempo estimado de entrega (en minutos):");
        if (!tiempoEstimado || isNaN(tiempoEstimado)) {
            alert("Por favor, ingrese un tiempo válido.");
            return;
        }

        fetch(`/aceptar_pedido/${pedidoId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ tiempo_estimado: parseInt(tiempoEstimado) })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    alert('Pedido aceptado con éxito');
                    // Recargar la tabla después de un breve retraso
                    setTimeout(() => {
                        $('#tablaPedidosPendientes').DataTable().ajax.reload(null, false);
                    }, 500);
                } else {
                    alert('Error al aceptar el pedido: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al aceptar el pedido');
            });
    }

    // Modifica la función cancelarPedidoAdmin para evitar el error después del éxito
    function cancelarPedidoAdmin(pedidoId) {
        if (confirm("¿Estás seguro de cancelar este pedido?")) {
            fetch(`/cancelar_pedido_admin/${pedidoId}`, {
                method: 'POST'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error HTTP: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        alert(data.message);  // Mostrar el mensaje personalizado
                        // Recargar la tabla después de un breve retraso
                        setTimeout(() => {
                            $('#tablaPedidosPendientes').DataTable().ajax.reload(null, false);
                        }, 500);
                    } else {
                        alert('Error al cancelar el pedido: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Hubo un error al cancelar el pedido');
                });
        }
    }

    let lastCount = 0;

    function actualizarPedidosPendientes() {
        fetch('/obtener_numero_pedidos_pendientes')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const badge = document.getElementById('pedidos-pendientes-badge');
                    const tabTitle = document.getElementById('v-pills-pedidos-tab');
                    if (data.count > 0) {
                        badge.textContent = data.count;
                        badge.style.display = 'inline-block';
                        tabTitle.textContent = `Pedidos (${data.count})`;
                        document.title = `(${data.count}) Pedidos - Panel de Administración`;

                        // Reproducir sonido si hay un nuevo pedido
                        if (data.count > lastCount) {
                            const audio = new Audio('/public/sounds/notification.mp3');
                            audio.play();
                        }
                    } else {
                        badge.style.display = 'none';
                        tabTitle.textContent = 'Pedidos';
                        document.title = 'Pedidos - Panel de Administración';
                    }
                    lastCount = data.count;
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    // Corrige la función cargarPedidosPendientes para que esté disponible globalmente
    window.cargarPedidosPendientes = function () {
        $('#tablaPedidosPendientes').DataTable().ajax.reload(null, false);
    };

    $(document).ready(function () {
        // Inicializar la tabla
        var tabla = $('#tablaPedidosPendientes').DataTable({
            ajax: {
                url: '/obtener_pedidos_pendientes',
                dataSrc: 'data'
            },
            columns: [
                { data: 'numero_pedido' },
                { data: 'nombre' },
                {
                    data: 'productos',
                    render: function (data) {
                        return data.map(p => `${p.name} (x${p.quantity})`).join('<br>');
                    }
                },
                { data: 'total', render: function (data) { return `$${data.toFixed(2)}`; } },
                {
                    data: '_id',
                    render: function (data) {
                        return `
                            <button class="btn btn-sm btn-success me-2" onclick="aceptarPedido('${data}')">
                                <i class="bi bi-check-lg"></i> Aceptar
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="cancelarPedidoAdmin('${data}')">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </button>
                        `;
                    }
                }
            ],
            language: {
                search: "Buscar:",
                lengthMenu: "Mostrar _MENU_ registros por página",
                zeroRecords: "No se encontraron resultados",
                info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
                infoEmpty: "Mostrando 0 a 0 de 0 registros",
                infoFiltered: "(filtrado de _MAX_ registros totales)",
                paginate: {
                    first: "Primero",
                    last: "Último",
                    next: "Siguiente",
                    previous: "Anterior"
                }
            },
            dom: '<"top"lf>rt<"bottom"ip><"clear">',  // Personalizar la disposición de los controles
            responsive: true  // Hacer la tabla responsive
        });

        // Actualizar la tabla cada 5 segundos
        setInterval(function () {
            try {
                tabla.ajax.reload(null, false);
            } catch (error) {
                console.error("Error al recargar la tabla:", error);
            }
        }, 5000);
    });
</script>
