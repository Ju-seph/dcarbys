<div class="table-responsive">
    <table id="tablaPedidosFinalizados" width="100%" cellspacing="0" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Número de Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Fecha de Finalización</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los pedidos finalizados se cargarán dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>

<!-- Incluir PDFMake desde un CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<style>
    /* Estilos para la tabla */
    #tablaPedidosFinalizados {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.9em;
        font-family: sans-serif;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        background-color: #f8f9fa;
        color: #333333;
    }

    /* Encabezado de la tabla */
    #tablaPedidosFinalizados thead tr {
        background-color: #28a745;
        color: #ffffff;
    }

    /* Celdas de la tabla */
    #tablaPedidosFinalizados th,
    #tablaPedidosFinalizados td {
        padding: 12px 15px;
        border: 1px solid #dddddd;
    }

    /* Filas pares */
    #tablaPedidosFinalizados tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
    }

    /* Filas impares */
    #tablaPedidosFinalizados tbody tr:nth-of-type(odd) {
        background-color: #ffffff;
    }

    /* Última fila */
    #tablaPedidosFinalizados tbody tr:last-of-type {
        border-bottom: 2px solid #28a745;
    }

    /* Efecto hover */
    #tablaPedidosFinalizados tbody tr:hover {
        background-color: #d4edda;
    }

    /* Botones en la columna de acciones */
    .btn-sm {
        margin: 2px;
    }

    .btn-info {
        background-color: #17a2b8;
        border-color: #17a2b8;
    }
</style>

<script>
    $(document).ready(function () {
        // Función para cargar los pedidos finalizados
        function cargarPedidosFinalizados() {
            $('#tablaPedidosFinalizados').DataTable().ajax.reload(null, false);
        }

        // Inicializar la tabla
        var tabla = $('#tablaPedidosFinalizados').DataTable({
            ajax: {
                url: '/obtener_pedidos_finalizados',
                dataSrc: 'data'
            },
            columns: [
                { data: 'numero_pedido' },
                { data: 'nombre' },
                {
                    data: 'productos',
                    render: function (data) {
                        return data.map(p => `${p.name} (x${p.quantity})`).join('<br>');
                    }
                },
                { data: 'total', render: function (data) { return `$${data.toFixed(2)}`; } },
                {
                    data: 'fecha_finalizacion',
                    render: function (data) {
                        if (data) {
                            const fecha = new Date(data);
                            return fecha.toLocaleString('es-EC', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            });
                        }
                        return 'No disponible';
                    }
                },
                {
                    data: '_id',
                    render: function (data, type, row) {
                        return `
                        <button class="btn btn-sm btn-info" onclick="mostrarTicket('${data}')">
                            <i class="bi bi-receipt"></i> Ticket
                        </button>
                    `;
                    }
                }
            ],
            order: [[4, 'desc']],  // Ordenar por la columna de fecha de finalización
            language: {
                search: "Buscar:",
                lengthMenu: "Mostrar _MENU_ registros por página",
                zeroRecords: "No se encontraron resultados",
                info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
                infoEmpty: "Mostrando 0 a 0 de 0 registros",
                infoFiltered: "(filtrado de _MAX_ registros totales)",
                paginate: {
                    first: "Primero",
                    last: "Último",
                    next: "Siguiente",
                    previous: "Anterior"
                }
            },
            dom: '<"top"lf>rt<"bottom"ip><"clear">',
            responsive: true
        });

        // Actualizar la tabla cada 5 segundos
        setInterval(cargarPedidosFinalizados, 5000);
    });

    function mostrarTicket(pedidoId) {
        fetch(`/obtener_detalles_pedido/${pedidoId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const pedido = data.pedido;

                    // Definir el contenido del PDF
                    const docDefinition = {
                        content: [
                            { text: 'Ticket del Pedido', style: 'header' },
                            `Número de Pedido: ${pedido.numero_pedido}`,
                            `Cliente: ${pedido.nombre}`,
                            `Celular: ${pedido.celular}`,
                            `Ciudad: ${pedido.ciudad}`,
                            `Dirección: ${pedido.direccion}`,
                            `Referencia: ${pedido.referencia}`,
                            `Método de Pago: ${pedido.metodo_pago}`,
                            `Total: $${pedido.total.toFixed(2)}`,
                            `Fecha de Confirmación: ${pedido.fecha_confirmacion ? new Date(pedido.fecha_confirmacion).toLocaleString() : 'No disponible'}`,
                            `Fecha de Finalización: ${pedido.fecha_finalizacion ? new Date(pedido.fecha_finalizacion).toLocaleString() : 'No disponible'}`,
                            { text: 'Productos:', style: 'subheader' },
                            {
                                table: {
                                    headerRows: 1,
                                    widths: ['*', 'auto', 'auto'],
                                    body: [
                                        ['Producto', 'Cantidad', 'Precio'],
                                        ...pedido.productos.map(p => [p.name, p.quantity, `$${p.price * p.quantity}`])
                                    ]
                                }
                            }
                        ],
                        styles: {
                            header: {
                                fontSize: 18,
                                bold: true,
                                margin: [0, 0, 0, 10]
                            },
                            subheader: {
                                fontSize: 14,
                                bold: true,
                                margin: [0, 10, 0, 5]
                            }
                        }
                    };

                    // Generar y abrir el PDF
                    pdfMake.createPdf(docDefinition).open();
                } else {
                    alert('Error al obtener los detalles del pedido: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Hubo un error al obtener los detalles del pedido');
            });
    }
</script>
