<div class="table-responsive">
    <table id="tablaPedidosCancelados" width="100%" cellspacing="0" class="table table-striped">
        <thead>
            <tr>
                <th>Número de Pedido</th>
                <th>Cliente</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Cancelado por</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los pedidos cancelados se cargarán dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>

<script>
    $(document).ready(function () {
        $('#tablaPedidosCancelados').DataTable({
            ajax: {
                url: '/obtener_pedidos_cancelados',
                dataSrc: 'data'
            },
            columns: [
                { data: 'numero_pedido' },
                { data: 'nombre' },
                {
                    data: 'productos',
                    render: function (data) {
                        return data.map(p => `${p.name} (x${p.quantity})`).join('<br>');
                    }
                },
                { data: 'total', render: function (data) { return `$${data.toFixed(2)}`; } },
                { data: 'cancelado_por' }
            ]
        });
    });
</script>
