{% extends "base.html" %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Completando tu pedido</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <p>Estamos procesando tu pago con PayPhone. Por favor, espera un momento...</p>
                    </div>
                    <div id="loading" class="text-center my-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-2">Recuperando información de tu pedido...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Recuperar datos del pago de PayPhone
        const paymentId = "{{ payment_id }}";
        const clientTransactionId = "{{ client_transaction_id }}";

        // Recuperar el carrito del localStorage
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');

        // Recuperar la respuesta de PayPhone si existe
        const payphone_response = JSON.parse(localStorage.getItem('payphone_response') || '{}');

        console.log("Recuperando carrito:", cart);
        console.log("Respuesta de PayPhone:", payphone_response);

        // Crear un formulario para enviar los datos
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/procesar_pago_payphone_manual';
        form.style.display = 'none';

        // Añadir los campos necesarios
        const addField = (name, value) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            input.value = value;
            form.appendChild(input);
        };

        addField('payment_id', paymentId);
        addField('client_transaction_id', clientTransactionId);
        addField('cart', JSON.stringify(cart));
        addField('payphone_response', JSON.stringify(payphone_response));

        // Añadir el formulario al documento y enviarlo
        document.body.appendChild(form);

        // Esperar un momento antes de enviar el formulario
        setTimeout(() => {
            console.log("Enviando formulario con datos de pago...");
            form.submit();
        }, 2000);
    });
</script>
{% endblock %}
