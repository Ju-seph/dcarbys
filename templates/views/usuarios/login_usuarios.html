{% extends 'base.html' %}

{% block body %}

<!-- Formulario de Inicio de Sesión -->
<div class="container-fluid min-vh-100 d-flex align-items-center bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 fw-bold text-primary">Iniciar sesión</h2>
                        <p class="text-center text-muted mb-4">Accede a tu cuenta para continuar con tu pedido</p>
                        
                        <form method="POST" action="/login_usuarios">
                            <!-- Campo de Nombre de Usuario -->
                            <div class="mb-4">
                                <label for="username" class="form-label">Nombre de usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control" id="u_nombreUsuario" name="u_nombreUsuario" required placeholder="Ingresa tu nombre de usuario">
                                </div>
                            </div>
                            
                            <!-- Campo de Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="u_clave" name="u_clave" required placeholder="Ingresa tu contraseña">
                                </div>
                            </div>
                            
                            <!-- Botón de Iniciar Sesión -->
                            <div class="d-grid gap-2 mb-4">
                                <button type="submit" class="btn btn-primary btn-lg">Iniciar sesión</button>
                            </div>
                        </form>

                        <!-- Enlace de Registro -->
                        <div class="text-center">
                            <p class="text-muted">¿No tienes cuenta? <a href="/registro_usuarios" class="text-decoration-none">Regístrate aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
