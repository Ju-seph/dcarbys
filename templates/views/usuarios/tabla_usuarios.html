<div class="container mt-4">
    <div class="row">
        <div class="col">
            <button type="button" class="btn btn-success" id="btn-add-user">
                <i class="bi bi-plus-circle"></i> Agregar Usuario
            </button>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col">
            <div class="table-responsive">
                <table id="table_usuario" class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre de Usuario</th>
                            <th>Correo</th>
                            <th>Clave</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los usuarios se cargarán dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal para agregar/editar usuarios -->
<div class="modal" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalLabel">Agregar Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="form_usuario">
                <div class="modal-body">
                    <div class="row">
                        <div class="mb-4">
                            <label for="u_nombreUsuario" class="form-label text-muted">Nombre de usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control" id="u_nombreUsuario" name="u_nombreUsuario"
                                    required placeholder="Ingresa tu nombre de usuario">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="u_correo" class="form-label text-muted">Correo electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                <input type="email" class="form-control" id="u_correo" name="u_correo" required
                                    placeholder="Ingresa tu correo electrónico">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="u_clave" class="form-label text-muted">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="u_clave" name="u_clave" required
                                    placeholder="Crea una contraseña segura">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label text-muted">Confirmar contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirm_password"
                                    name="confirm_password" required placeholder="Confirma tu contraseña">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="u_rol" class="form-label text-muted">Rol</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-briefcase-fill"></i></span>
                                <select class="form-select" id="u_rol" name="u_rol" required>
                                    <option value="" disabled selected>Seleccione un rol</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Asistente">Asistente</option>
                                    <option value="Cliente">Cliente</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btn-guardar-usuario" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Script personalizado -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Inicializar DataTable
        var tabla = $('#table_usuario').DataTable({
            ajax: {
                url: '/ver_usuarios',
                method: 'POST',
                dataSrc: 'data',
                error: function (xhr, error, thrown) {
                    console.error('Error loading data:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'No se pudieron cargar los datos. Por favor, recargue la página.',
                    });
                }
            },
            columns: [
                { data: '_id', className: 'text-center', visible: false }, // Ocultar ID
                { data: 'nombreUsuario', className: 'text-center' },
                { data: 'correo', className: 'text-center' },
                { data: 'clave', className: 'text-center', visible: false }, // Ocultar contraseña
                { data: 'rol', className: 'text-center' },
                { data: 'status', className: 'text-center' },
                {
                    data: null,
                    className: 'text-center',
                    render: function (data, type, row) {
                        return `
                            <button class="btn btn-sm btn-primary btn-editar-usuario">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger btn-eliminar-usuario">
                                <i class="bi bi-trash"></i>
                            </button>
                        `;
                    }
                }
            ],
            columnDefs: [
                { targets: [0, 3], visible: false } // Ocultar columnas 0 (ID) y 3 (Contraseña)
            ],
            language: {
                url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            },
            pageLength: 10,
            lengthMenu: [10, 20, 30]
        });

        // Botón para abrir el modal de agregar usuario
        document.getElementById('btn-add-user').addEventListener('click', function () {
            // Limpiar el formulario
            document.getElementById('form_usuario').reset();
            document.getElementById('userModalLabel').textContent = 'Agregar Usuario';
            document.getElementById('form_usuario').setAttribute('data-action', 'save');

            // Eliminar cualquier campo oculto de ID
            const hiddenIdField = document.querySelector('input[name="u_id"]');
            if (hiddenIdField) hiddenIdField.remove();

            // Mostrar el modal usando JavaScript puro
            const userModal = new bootstrap.Modal(document.getElementById('userModal'));
            userModal.show();
        });

        // Botón Eliminar Usuario
        document.querySelector('#table_usuario tbody').addEventListener('click', function (e) {
            if (e.target.closest('.btn-eliminar-usuario')) {
                const row = e.target.closest('tr');
                const data = tabla.row(row).data();

                Swal.fire({
                    title: '¿Estás seguro?',
                    text: '¿Deseas eliminar el usuario ' + data.nombreUsuario + '?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Crear FormData para enviar
                        const formData = new FormData();
                        formData.append('u_id', data._id);

                        // Enviar solicitud AJAX
                        fetch('/del_usuarios', {
                            method: 'POST',
                            body: formData
                        })
                            .then(response => response.json())
                            .then(data => {
                                Swal.fire(
                                    '¡Eliminado!',
                                    'El usuario ha sido eliminado correctamente.',
                                    'success'
                                );
                                tabla.ajax.reload(null, false);
                            })
                            .catch(error => {
                                Swal.fire(
                                    'Error',
                                    'Ha ocurrido un error al eliminar el usuario.',
                                    'error'
                                );
                                console.error('Error:', error);
                            });
                    }
                });
            }
        });

        // Botón Editar Usuario
        document.querySelector('#table_usuario tbody').addEventListener('click', function (e) {
            if (e.target.closest('.btn-editar-usuario')) {
                const row = e.target.closest('tr');
                const data = tabla.row(row).data();

                // Eliminar cualquier campo oculto de ID previo
                const hiddenIdField = document.querySelector('input[name="u_id"]');
                if (hiddenIdField) hiddenIdField.remove();

                // Establecer valores del formulario
                document.getElementById('userModalLabel').textContent = 'Editar Usuario';
                document.getElementById('u_nombreUsuario').value = data.nombreUsuario;
                document.getElementById('u_correo').value = data.correo;
                document.getElementById('u_clave').value = data.clave;
                document.getElementById('confirm_password').value = data.clave;
                document.getElementById('u_rol').value = data.rol;

                // Establecer acción del formulario y agregar campo oculto de ID
                document.getElementById('form_usuario').setAttribute('data-action', 'edit');
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'u_id';
                hiddenInput.value = data._id;
                document.getElementById('form_usuario').appendChild(hiddenInput);

                // Mostrar el modal
                const userModal = new bootstrap.Modal(document.getElementById('userModal'));
                userModal.show();
            }
        });

        // Manejar envío del formulario
        document.getElementById('form_usuario').addEventListener('submit', function (e) {
            e.preventDefault();

            // Validar que las contraseñas coincidan
            const password = document.getElementById('u_clave').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Las contraseñas no coinciden',
                });
                return;
            }

            // Deshabilitar el botón de envío para evitar múltiples envíos
            document.getElementById('btn-guardar-usuario').disabled = true;

            // Determinar la URL basada en la acción
            const action = this.getAttribute('data-action');
            const url = action === 'edit' ? '/edit_usuarios' : '/save_usuarios';

            // Crear FormData para enviar
            const formData = new FormData(this);

            // Enviar solicitud AJAX usando Fetch API
            fetch(url, {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    // Cerrar el modal manualmente
                    const modalElement = document.getElementById('userModal');
                    const modalInstance = bootstrap.Modal.getInstance(modalElement);
                    modalInstance.hide();

                    // Esperar a que se cierre el modal antes de mostrar la alerta
                    setTimeout(() => {
                        Swal.fire({
                            icon: 'success',
                            title: '¡Éxito!',
                            text: data.message || 'Operación completada con éxito',
                        });

                        // Recargar la tabla después de un breve retraso
                        setTimeout(() => {
                            tabla.ajax.reload(null, false);
                        }, 300);
                    }, 300);
                })
                .catch(error => {
                    console.error('Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Ha ocurrido un error. Por favor, inténtelo de nuevo.',
                    });
                })
                .finally(() => {
                    // Habilitar el botón de envío nuevamente
                    document.getElementById('btn-guardar-usuario').disabled = false;
                });
        });

        // Limpiar el modal cuando se cierra
        document.getElementById('userModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('form_usuario').reset();
        });
    });
</script>
