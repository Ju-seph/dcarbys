<style>
    /* Estilos personalizados para la tabla */
    #table_usuario {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.9em;
        font-family: sans-serif;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        background-color: #f8f9fa;
        color: #333333;
    }

    #table_usuario thead tr {
        background-color: #007bff;
        color: #ffffff;
    }

    #table_usuario th,
    #table_usuario td {
        padding: 12px 15px;
        border: 1px solid #dddddd;
    }

    #table_usuario tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
    }

    #table_usuario tbody tr:nth-of-type(odd) {
        background-color: #ffffff;
    }

    #table_usuario tbody tr:last-of-type {
        border-bottom: 2px solid #007bff;
    }

    #table_usuario tbody tr:hover {
        background-color: #e9ecef;
    }

    .btn-sm {
        margin: 2px;
    }

    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
    }

    .btn-danger {
        background-color: #dc3545;
        border-color: #dc3545;
    }
</style>
</head>

<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col">
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#userModal">
                    <i class="bi bi-plus-circle"></i> Agregar Usuario
                </button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col">
                <div class="table-responsive">
                    <table id="table_usuario" class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre de Usuario</th>
                                <th>Correo</th>
                                <th>Clave</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los usuarios se cargarán dinámicamente con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar usuarios -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Agregar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form_usuario">
                    <div class="modal-body">
                        <div class="row">
                            <div class="mb-4">
                                <label for="u_nombreUsuario" class="form-label text-muted">Nombre de usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control" id="u_nombreUsuario" name="u_nombreUsuario"
                                        required placeholder="Ingresa tu nombre de usuario">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="u_correo" class="form-label text-muted">Correo electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                    <input type="email" class="form-control" id="u_correo" name="u_correo" required
                                        placeholder="Ingresa tu correo electrónico">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="u_clave" class="form-label text-muted">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="u_clave" name="u_clave" required
                                        placeholder="Crea una contraseña segura">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirm_password" class="form-label text-muted">Confirmar contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="confirm_password"
                                        name="confirm_password" required placeholder="Confirma tu contraseña">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="u_rol" class="form-label text-muted">Rol</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-briefcase-fill"></i></span>
                                    <select class="form-select" id="u_rol" name="u_rol" required>
                                        <option value="" disabled selected>Seleccione un rol</option>
                                        <option value="Administrador">Administrador</option>
                                        <option value="Asistente">Asistente</option>
                                        <option value="Cliente">Cliente</option>

                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="btn-guardar-usuario" class="btn btn-primary">Guardar Cambios</button>
                        <button type="button" id="btn-editar-usuario" class="btn btn-success"
                            style="display: none;">Editar Campo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <!-- Script personalizado -->
    <script>
        $(document).ready(function () {
            var tabla = $('#table_usuario').DataTable({
                ajax: {
                    url: '/ver_usuarios',
                    method: 'POST',
                    dataSrc: 'data'
                },
                columns: [
                    { data: '_id', className: 'text-center', visible: false }, // Ocultar ID
                    { data: 'nombreUsuario', className: 'text-center' },
                    { data: 'correo', className: 'text-center' },
                    { data: 'clave', className: 'text-center', visible: false }, // Ocultar contraseña
                    { data: 'rol', className: 'text-center' },
                    { data: 'status', className: 'text-center' },
                    {
                        data: null,
                        className: 'text-center',
                        render: function (data, type, row) {
                            return `
                        <button class="btn btn-sm btn-primary btn-editar-usuario">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-danger btn-eliminar-usuario">
                            <i class="bi bi-trash"></i>
                        </button>
                    `;
                        }
                    }
                ],
                columnDefs: [
                    { targets: [0, 3], visible: false } // Ocultar columnas 0 (ID) y 3 (Contraseña)
                ],
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                },
                pageLength: 10,
                lengthMenu: [10, 20, 30]
            });

            // Botón Eliminar Usuario
            $('#table_usuario tbody').on('click', '.btn-eliminar-usuario', function () {
                var datos = tabla.row($(this).parents('tr')).data();
                if (confirm('¿Estás seguro de eliminar el usuario ' + datos.nombreUsuario + '?')) {
                    $.ajax({
                        url: '/del_usuarios',
                        type: 'POST',
                        data: { u_id: datos._id }
                    }).done(function () {
                        tabla.ajax.reload();
                    }).fail(function (e) {
                        alert('Error: ' + e.responseJSON.message);
                    });
                }
            });

            // Botón Editar Usuario
            $('#table_usuario tbody').on('click', '.btn-editar-usuario', function () {
                var datos = tabla.row($(this).parents('tr')).data();
                $('#userModal').modal('show');
                $('#userModalLabel').text('Editar Usuario'); // Cambiar el título del modal
                $('#u_nombreUsuario').val(datos.nombreUsuario);
                $('#u_correo').val(datos.correo);
                $('#u_clave').val(datos.clave);
                $('#u_rol').val(datos.rol);
                $('#form_usuario').attr('url', '/edit_usuarios');
                $('#form_usuario').append(`<input type="hidden" name="u_id" value="${datos._id}">`);
            });

            // Formulario para guardar/editar usuarios
            $('#form_usuario').submit(function (e) {
                e.preventDefault();
                var formData = new FormData(this);
                $.ajax({
                    url: $(this).attr('url'),
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false
                }).done(function (e) {

                    alert(e.message); // Mostrar mensaje de éxito
                    $('#userModal').modal('hide'); // Cerrar el modal
                    tabla.ajax.reload(); // Recargar la tabla
                }).fail(function (e) {
                    alert('Error: ' + e.responseJSON.message);
                });
            });

            // Mostrar modal para agregar usuario
            $('#userModal').on('show.bs.modal', function () {
                $('#form_usuario')[0].reset();
                $('#userModalLabel').text('Agregar Usuario'); // Cambiar el título del modal
                $('#form_usuario').attr('url', '/save_usuarios');
                $('#form_usuario').find('input[name="u_id"]').remove(); // Limpiar el campo oculto de ID
            });
        });
    </script>
